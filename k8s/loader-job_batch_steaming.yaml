apiVersion: batch/v1
kind: Job
metadata:
  name: dblp-loader
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: dblp-loader
    spec:
      restartPolicy: Never
      containers:
        - name: dblp-loader
          image: kdemont/neo4jtp:latest
          imagePullPolicy: Always
          env:
            - name: JSON_FILE
              value: "http://vmrum.isc.heia-fr.ch/files/DBLP-Citation-network-V18.jsonl"
            - name: MAX_ARTICLES
              value: "6000000"
            - name: BATCH_SIZE
              value: "10000"
            - name: HTTP_CHUNK_SIZE_MB
              value: "16"
            - name: NEO4J_IP
              value: "neo4j-svc"
          resources:
            requests:
              memory: "3Gi"
              cpu: "1"
            limits:
              memory: "3Gi"
              cpu: "2"
